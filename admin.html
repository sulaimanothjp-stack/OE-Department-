<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SE · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:#020912;color:#E8F0FF;font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:#060F1E}::-webkit-scrollbar-thumb{background:#1E3A56;border-radius:2px}
.shell{display:flex;height:100vh;overflow:hidden}
.sb{width:240px;flex-shrink:0;background:linear-gradient(180deg,#091628,#060F1E);border-left:1px solid #152840;display:flex;flex-direction:column}
.sb-brand{padding:14px 12px;border-bottom:1px solid #152840;display:flex;align-items:center;gap:8px}
.sb-t1{font-family:'Chakra Petch',monospace;font-size:14px;font-weight:700;color:#4F46E5}
.sb-t2{font-size:10px;color:#3E5878}
.ub{margin:8px;padding:8px;background:#0C1E38;border:1px solid #152840;border-radius:8px;display:flex;align-items:center;gap:8px}
.ub-av{width:30px;height:30px;border-radius:7px;background:rgba(79,70,229,.2);color:#818CF8;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.ub-nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub-rl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#8098BC}
.odot{width:7px;height:7px;border-radius:50%;background:#10B981;box-shadow:0 0 5px #10B981;margin-right:auto;flex-shrink:0}
.nav{flex:1;overflow-y:auto;padding:5px 0}
.ng{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#3E5878;letter-spacing:.14em;padding:8px 12px 3px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:8px;padding:7px 12px;color:#8098BC;font-size:13px;cursor:pointer;border:none;background:none;width:100%;text-align:right;transition:.12s;border-radius:0}
.ni:hover{color:#E8F0FF;background:#0C1E38}
.ni.on{color:#818CF8;background:rgba(79,70,229,.12)}
.ni .ic{width:18px;text-align:center;font-size:13px}
.sb-foot{padding:8px;border-top:1px solid #152840;display:flex;gap:5px}
.btn-lo{flex:1;padding:7px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#EF4444;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:52px;background:rgba(6,15,30,.97);border-bottom:1px solid #152840;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
.tb-ttl{font-family:'Chakra Petch',monospace;font-size:14px;font-weight:600;color:#818CF8}
.tb-r{display:flex;align-items:center;gap:10px}
.clk-t{font-family:'Chakra Petch',monospace;font-size:13px;color:#4F46E5}
.clk-d{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#3E5878}
.adot{display:flex;align-items:center;gap:5px}
.adot .d{width:7px;height:7px;border-radius:50%;background:#4F46E5;box-shadow:0 0 5px #4F46E5;animation:pd 2s infinite}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.4}}
.page{flex:1;overflow-y:auto;padding:16px}
.sc{background:linear-gradient(145deg,#0C1E38,#091628);border:1px solid #152840;border-radius:10px;padding:14px;position:relative;overflow:hidden;transition:.18s}
.sc:hover{transform:translateY(-2px)}
.sc .sl{font-size:11.5px;color:#8098BC;margin-bottom:8px}
.sc .sv{font-family:'Chakra Petch',monospace;font-size:28px;font-weight:700;background:linear-gradient(135deg,#4F46E5,#818CF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sc .sv.grn{background:linear-gradient(135deg,#10B981,#34D399)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.bg{background:rgba(21,40,64,.8);border:1px solid #152840;color:#8098BC}
.panel{background:#091628;border:1px solid #152840;border-radius:10px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #152840}
.ph h3{font-family:'Chakra Petch',monospace;font-size:12.5px;font-weight:600;color:#818CF8}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #152840;background:#0C1E38;color:#E8F0FF;white-space:nowrap;transition:.14s}
.btn:hover{background:#1E3A56}
.btn.p{background:linear-gradient(135deg,#4F46E5,#818CF8);border-color:#4F46E5;color:#fff}
.btn.p:hover{filter:brightness(1.1)}
.btn.d{background:transparent;border-color:rgba(239,68,68,.35);color:#EF4444}
.btn.sm{padding:4px 11px;font-size:11.5px}
.ur{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(79,70,229,.07);transition:.13s}
.ur:hover{background:rgba(79,70,229,.04)}
.ur:last-child{border-bottom:none}
.ur-av{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:#8098BC;margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;background:#060F1E;border:1px solid #152840;color:#E8F0FF;border-radius:7px;padding:8px 11px;font-size:13.5px;font-family:'IBM Plex Sans Arabic',sans-serif;transition:.14s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#4F46E5}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ff{grid-column:1/-1}
.mbg{position:fixed;inset:0;background:rgba(2,9,18,.88);backdrop-filter:blur(5px);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.modal{background:#091628;border:1px solid #152840;border-radius:12px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.8);animation:mani .2s ease}
@keyframes mani{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal.w{max-width:720px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #152840;position:sticky;top:0;background:#091628;z-index:1}
.mh h3{font-family:'Chakra Petch',monospace;font-size:14px;font-weight:600;color:#818CF8}
.mx{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#8098BC;font-size:17px;cursor:pointer;transition:.12s;border:none;background:none}
.mx:hover{background:rgba(239,68,68,.15);color:#EF4444}
.mbd{padding:16px 18px}
.mf{padding:11px 18px;border-top:1px solid #152840;display:flex;justify-content:flex-end;gap:7px;background:#091628;position:sticky;bottom:0}
.creds{background:#070F1D;border:1px solid rgba(79,70,229,.25);border-radius:8px;padding:14px;font-family:'IBM Plex Mono',monospace}
.cl{font-size:9.5px;color:#3E5878;letter-spacing:.06em;margin-bottom:3px;margin-top:8px}
.cv{font-size:13px;font-weight:700;color:#818CF8;background:#0A1828;padding:6px 10px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;word-break:break-all}
.cpbtn{padding:2px 8px;border-radius:5px;background:rgba(79,70,229,.2);border:1px solid rgba(79,70,229,.3);color:#818CF8;cursor:pointer;font-size:10px;white-space:nowrap;flex-shrink:0;font-family:'IBM Plex Mono',monospace}
#tc{position:fixed;bottom:18px;right:18px;z-index:500;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:10px;border:1px solid;font-size:13px;font-weight:500;min-width:240px;max-width:340px;pointer-events:all;animation:tin .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.5)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.toast.s{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#10B981}
.toast.e{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#EF4444}
.toast.i{background:rgba(79,70,229,.1);border-color:rgba(79,70,229,.3);color:#818CF8}
.spin{width:14px;height:14px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:sp .6s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:rgba(79,70,229,.08);border:1px solid rgba(79,70,229,.2);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#818CF8;margin-bottom:14px;line-height:1.6}
.fi{background:#060F1E;border:1px solid #152840;border-radius:8px;padding:7px 11px;font-size:13px;color:#E8F0FF;transition:.13s;font-family:'IBM Plex Sans Arabic',sans-serif}
.fi:focus{outline:none;border-color:#4F46E5}
.skr{height:42px;border-radius:8px;background:linear-gradient(90deg,#0C1E38 25%,#091628 50%,#0C1E38 75%);background-size:400% 100%;animation:sh 1.4s ease infinite;margin-bottom:7px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(max-width:768px){
  .sb{display:none;position:fixed;top:0;right:0;width:260px;height:100vh;z-index:9999;box-shadow:-8px 0 40px rgba(0,0,0,.8);flex-direction:column;}
  .sb.show{display:flex!important}
  .menu-btn{display:flex!important;align-items:center;justify-content:center;width:36px;height:36px;background:#0C1E38;border:1px solid #152840;border-radius:8px;color:#818CF8;font-size:18px;cursor:pointer;flex-shrink:0}
  .page{padding:10px}
  .g4{grid-template-columns:repeat(2,1fr)}
}
.menu-btn{display:none}
</style>
</head>
<body>
<div class="shell">
  <aside class="sb" id="sidebar">
    <div class="sb-brand">
      <img src="se-logo.png.PNG" alt="SE" style="height:28px;width:auto;object-fit:contain">
      <div><div class="sb-t1">se</div><div class="sb-t2">System Admin</div></div>
    </div>
    <div class="ub" id="ubEl">
      <div class="ub-av" id="ubAv">—</div>
      <div style="flex:1;min-width:0"><div class="ub-nm" id="ubNm">جارٍ التحميل</div><div class="ub-rl">Admin</div></div>
      <div class="odot"></div>
    </div>
    <nav class="nav">
      <div class="ng">الإدارة</div>
      <button class="ni on" onclick="showPage('users',this)"><span class="ic">👥</span> إدارة المستخدمين</button>
      <button class="ni" onclick="showPage('divs',this)"><span class="ic">🏛️</span> الدوائر</button>
      <div class="ng">الإعدادات</div>
      <button class="ni" onclick="showPage('myaccount',this)"><span class="ic">⚙️</span> حسابي</button>
      <button class="ni" onclick="showPage('health',this)"><span class="ic">💡</span> صحة النظام</button>
    </nav>
    <div class="sb-foot">
      <button class="btn-lo" onclick="doLogout()">🚪 خروج</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="tb-ttl" id="pgTitle">إدارة المستخدمين</div>
      <div class="tb-r">
        <div><div class="clk-t" id="ct">—</div><div class="clk-d" id="cd"></div></div>
        <div class="adot"><div class="d"></div><span style="color:#3E5878;font-family:'IBM Plex Mono',monospace;font-size:11px">ADMIN</span></div>
      </div>
    </div>
    <div class="page" id="pageArea">
      <div style="display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:12px">
        <div class="spin" style="width:36px;height:36px;border-width:3px;color:#4F46E5"></div>
        <div style="color:#8098BC;font-size:13px">جارٍ التحميل...</div>
      </div>
    </div>
  </div>
</div>
<div id="tc"></div>
<script src="app.js"></script>
<script>
const RLA = ROLE_AR;
const RCO = {admin:'#FCA5A5',director:'#FDE68A',governance_manager:'#C4B5FD',generation_manager:'#FDE68A',national_grid_manager:'#BAE6FD',distribution_manager:'#A7F3D0',technical_alerts_manager:'#FCA5A5',employee:'#8098BC'};
const RCL = {admin:'rgba(239,68,68,.15)',director:'rgba(212,175,55,.12)',governance_manager:'rgba(124,58,237,.15)',generation_manager:'rgba(245,158,11,.12)',national_grid_manager:'rgba(14,165,233,.12)',distribution_manager:'rgba(16,185,129,.12)',technical_alerts_manager:'rgba(239,68,68,.12)',employee:'rgba(30,58,88,.5)'};

function toggleSidebar(){const sb=document.getElementById('sidebar');if(!sb)return;const show=sb.classList.toggle('show');let ov=document.getElementById('sbOv');if(!ov){ov=document.createElement('div');ov.id='sbOv';ov.style.cssText='display:none;position:fixed;inset:0;background:rgba(2,9,18,.75);z-index:9998';ov.onclick=toggleSidebar;document.body.appendChild(ov);}ov.style.display=show?'block':'none';}

function showPage(name, btn){
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  const titles={users:'إدارة المستخدمين',divs:'الدوائر',myaccount:'حسابي',health:'صحة النظام'};
  document.getElementById('pgTitle').textContent=titles[name]||name;
  const area=document.getElementById('pageArea');
  area.innerHTML='<div class="skr"></div><div class="skr"></div><div class="skr"></div>';
  if(name==='users') renderUsers();
  else if(name==='divs') renderDivs();
  else if(name==='myaccount') renderMyAccount();
  else if(name==='health') renderHealth();
}

/* ═══ USERS PAGE ═══ */
async function renderUsers(){
  const area=document.getElementById('pageArea');
  area.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">'+
      '<div><h1 style="font-family:\'Chakra Petch\',monospace;font-size:18px;color:#818CF8">👥 إدارة المستخدمين</h1>'+
      '<div style="font-size:12px;color:#8098BC">أنشئ الحسابات · غيّر كلمات المرور · اضبط الأدوار والدوائر</div></div>'+
      '<button class="btn p" onclick="openCU()">+ إنشاء مستخدم</button>'+
    '</div>'+
    '<div class="g4" style="margin-bottom:14px">'+
      '<div class="sc"><div class="sl">الكل</div><div class="sv" id="stAll">—</div></div>'+
      '<div class="sc"><div class="sl">مدراء</div><div class="sv" id="stMgr">—</div></div>'+
      '<div class="sc"><div class="sl">موظفون</div><div class="sv" id="stEmp">—</div></div>'+
      '<div class="sc"><div class="sl">نشطون</div><div class="sv grn" id="stAct">—</div></div>'+
    '</div>'+
    '<div class="panel">'+
      '<div style="padding:10px 12px;border-bottom:1px solid #152840;display:flex;gap:8px;flex-wrap:wrap">'+
        '<input class="fi" id="uq" placeholder="بحث..." style="min-width:140px" oninput="loadUsers()">'+
        '<select class="fi" id="ur" onchange="loadUsers()">'+
          '<option value="">كل الأدوار</option>'+
          Object.entries(RLA).map(function(e){return '<option value="'+e[0]+'">'+e[1]+'</option>';}).join('')+
        '</select>'+
        '<button class="btn sm" onclick="loadUsers()">🔄</button>'+
      '</div>'+
      '<div id="uList"><div class="skr" style="margin:10px"></div><div class="skr" style="margin:10px"></div></div>'+
    '</div>';
  loadUsers();
}

let _allUsers=[];
async function loadUsers(){
  const el=document.getElementById('uList');
  if(!el) return;
  el.innerHTML='<div style="padding:14px;text-align:center;color:#8098BC">جارٍ التحميل...</div>';
  try{
    const data=await appListUsers();
    _allUsers=Array.isArray(data)?data:[];
    const q=(document.getElementById('uq')?.value||'').toLowerCase();
    const r=document.getElementById('ur')?.value||'';
    let fl=_allUsers;
    if(r) fl=fl.filter(function(u){return u.role===r;});
    if(q) fl=fl.filter(function(u){return ((u.full_name||'')+(u.username||'')).toLowerCase().indexOf(q)>-1;});
    document.getElementById('stAll').textContent=_allUsers.length;
    document.getElementById('stMgr').textContent=_allUsers.filter(function(u){return u.role&&(u.role.indexOf('manager')>-1||u.role==='director');}).length;
    document.getElementById('stEmp').textContent=_allUsers.filter(function(u){return u.role==='employee';}).length;
    document.getElementById('stAct').textContent=_allUsers.filter(function(u){return u.is_active;}).length;
    if(!fl.length){el.innerHTML='<div style="padding:40px;text-align:center;color:#8098BC">لا مستخدمين — <button class="btn sm p" onclick="openCU()">+ إنشاء أول مستخدم</button></div>';return;}
    el.innerHTML=fl.map(function(u){
      const init=(u.full_name||'U').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
      const clr=RCO[u.role]||'#8098BC';
      const bg=RCL[u.role]||'rgba(30,58,88,.5)';
      return '<div class="ur">'+
        '<div class="ur-av" style="background:'+bg+';color:'+clr+'">'+init+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:13px;font-weight:600">'+esc(u.full_name||'—')+'</div>'+
          '<div style="font-size:10.5px;color:#8098BC;font-family:\'IBM Plex Mono\',monospace">@'+esc(u.username||'')+'</div>'+
          '<div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">'+
            '<span class="badge" style="background:'+bg+';border:1px solid '+clr+'33;color:'+clr+'">'+esc(RLA[u.role]||u.role)+'</span>'+
            (u.division?'<span class="badge bg">'+esc(u.division)+'</span>':'')+
            '<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#3E5878">'+
              '<div style="width:6px;height:6px;border-radius:50%;background:'+(u.is_active?'#10B981':'#3E5878')+'"></div>'+
              (u.is_active?'نشط':'معطّل')+
            '</span>'+
          '</div>'+
        '</div>'+
        '<div style="display:flex;gap:4px;flex-shrink:0">'+
          '<button class="btn sm" onclick="openEU(\''+u.id+'\')">تعديل</button>'+
          '<button class="btn sm" onclick="openRP(\''+u.id+'\',\''+esc(u.full_name||'')+'\')">🔑 باسورد</button>'+
          '<button class="btn sm d" onclick="toggleU(\''+u.id+'\','+u.is_active+')">'+(u.is_active?'تعطيل':'تفعيل')+'</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }catch(e){
    el.innerHTML='<div style="padding:20px;text-align:center">'+
      '<div style="color:#EF4444;margin-bottom:8px">'+esc(e.message)+'</div>'+
      '<button class="btn sm" onclick="loadUsers()">إعادة المحاولة</button>'+
      '</div>';
  }
}

/* ═══ CREATE USER ═══ */
function openCU(){
  openModal(
    '<div class="mh"><h3>👤 إنشاء مستخدم جديد</h3><button class="mx" onclick="closeModal()">×</button></div>'+
    '<div class="mbd">'+
      '<div class="note">اسم المستخدم وكلمة المرور فقط — لا حاجة لإيميل حقيقي</div>'+
      '<div class="fg">'+
        '<div class="field ff"><label>الاسم الكامل *</label><input id="nu_n" placeholder="سليمان الخطيب"></div>'+
        '<div class="field ff"><label>اسم المستخدم *</label><input id="nu_un" placeholder="sulaiman"></div>'+
        '<div class="field ff">'+
          '<label>كلمة المرور *</label>'+
          '<div style="display:flex;gap:7px">'+
            '<input type="text" id="nu_pw" placeholder="كلمة مرور قوية...">'+
            '<button class="btn sm" onclick="genPW()">🔀 توليد</button>'+
          '</div>'+
        '</div>'+
        '<div class="field"><label>الدور *</label>'+
          '<select id="nu_rl" onchange="handleRC()">'+
            '<option value="">اختر...</option>'+
            Object.entries(RLA).map(function(e){return '<option value="'+e[0]+'">'+e[1]+'</option>';}).join('')+
          '</select>'+
        '</div>'+
        '<div class="field" id="nu_divF" style="display:none"><label>الدائرة</label>'+
          '<select id="nu_dv">'+
            '<option value="">—</option>'+
            Object.entries(DIVS).map(function(e){return '<option value="'+e[0]+'">'+e[1].icon+' '+e[1].ar+'</option>';}).join('')+
          '</select>'+
        '</div>'+
        '<div class="field"><label>المسمى الوظيفي</label><input id="nu_tt" placeholder="مدير دائرة..."></div>'+
      '</div>'+
    '</div>'+
    '<div class="mf"><button class="btn" onclick="closeModal()">إلغاء</button>'+
    '<button class="btn p" id="createBtn" onclick="createUser()">إنشاء الحساب</button></div>',
    'w'
  );
  genPW();
}
function handleRC(){
  const r=mv('nu_rl');
  const needDiv=['governance_manager','generation_manager','national_grid_manager','distribution_manager','technical_alerts_manager','employee'].indexOf(r)>-1;
  const f=document.getElementById('nu_divF');
  if(f)f.style.display=needDiv?'block':'none';
  const autoMap={governance_manager:'governance',generation_manager:'generation',national_grid_manager:'national_grid',distribution_manager:'distribution',technical_alerts_manager:'technical_alerts'};
  const ad=autoMap[r];
  if(ad){const d=document.getElementById('nu_dv');if(d)d.value=ad;}
}
function genPW(){
  const ch='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#$!';
  let p='';for(let i=0;i<10;i++)p+=ch[Math.floor(Math.random()*ch.length)];
  const el=document.getElementById('nu_pw');if(el){el.value=p;navigator.clipboard?.writeText(p).catch(function(){});}
}
async function createUser(){
  const name=mv('nu_n'),username=mv('nu_un'),pass=mv('nu_pw'),role=mv('nu_rl');
  if(!name||!username||!pass||!role){toast('يرجى تعبئة الحقول المطلوبة','e');return;}
  const btn=document.getElementById('createBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> جارٍ الإنشاء...';}
  try{
    await appCreateUser({username,password:pass,full_name:name,role,division:mv('nu_dv')||null,job_title:mv('nu_tt')||null});
    closeModal();
    showCreds(name,username,pass,RLA[role]||role);
    loadUsers();
  }catch(e){
    toast('فشل: '+e.message,'e');
    if(btn){btn.disabled=false;btn.innerHTML='إنشاء الحساب';}
  }
}
function showCreds(name,username,pass,role){
  openModal(
    '<div class="mh"><h3 style="color:#10B981">✓ تم إنشاء الحساب!</h3><button class="mx" onclick="closeModal()">×</button></div>'+
    '<div class="mbd">'+
      '<p style="font-size:13px;color:#8098BC;margin-bottom:12px">أعطِ هذه البيانات للمستخدم.</p>'+
      '<div class="creds">'+
        '<div class="cl">الاسم</div><div class="cv">'+esc(name)+'</div>'+
        '<div class="cl">الدور</div><div class="cv">'+esc(role)+'</div>'+
        '<div class="cl">اسم المستخدم</div>'+
        '<div class="cv"><span>'+esc(username)+'</span><button class="cpbtn" onclick="copyT(\''+esc(username)+'\')">نسخ</button></div>'+
        '<div class="cl">كلمة المرور</div>'+
        '<div class="cv"><span>'+esc(pass)+'</span><button class="cpbtn" onclick="copyT(\''+esc(pass)+'\')">نسخ</button></div>'+
      '</div>'+
    '</div>'+
    '<div class="mf"><button class="btn p" onclick="closeModal()">تم</button></div>','w');
}

/* ═══ EDIT USER ═══ */
async function openEU(id){
  const u=_allUsers.find(function(x){return x.id===id;});
  if(!u){toast('خطأ في جلب البيانات','e');return;}
  openModal(
    '<div class="mh"><h3>تعديل — '+esc(u.full_name||'')+'</h3><button class="mx" onclick="closeModal()">×</button></div>'+
    '<div class="mbd"><div class="fg">'+
      '<div class="field"><label>الاسم</label><input id="eu_n" value="'+esc(u.full_name||'')+'"></div>'+
      '<div class="field"><label>الدور</label><select id="eu_rl">'+
        Object.entries(RLA).map(function(e){return '<option value="'+e[0]+'"'+(u.role===e[0]?' selected':'')+'>'+e[1]+'</option>';}).join('')+
      '</select></div>'+
      '<div class="field"><label>الدائرة</label><select id="eu_dv">'+
        '<option value="">—</option>'+
        Object.entries(DIVS).map(function(e){return '<option value="'+e[0]+'"'+(u.division===e[0]?' selected':'')+'>'+e[1].icon+' '+e[1].ar+'</option>';}).join('')+
      '</select></div>'+

    '<button class="btn p" onclick="saveEU(\''+id+'\')">حفظ</button></div>','w');
}
async function saveEU(id){
  try{
    await appUpdateUser(id,{full_name:mv('eu_n'),full_name_en:null,role:mv('eu_rl'),division:mv('eu_dv')||null,job_title:mv('eu_tt')||null,job_title_en:null});
    toast('تم الحفظ ✓','s');closeModal();loadUsers();
  }catch(e){toast('خطأ: '+e.message,'e');}
}
async function toggleU(id,isActive){
  try{ await appToggleActive(id,!isActive); toast(isActive?'تم التعطيل':'تم التفعيل','s'); loadUsers(); }
  catch(e){toast('خطأ: '+e.message,'e');}
}

/* ═══ RESET PASSWORD — the missing piece ═══ */
function openRP(id,name){
  openModal(
    '<div class="mh"><h3>🔑 إعادة تعيين كلمة المرور</h3><button class="mx" onclick="closeModal()">×</button></div>'+
    '<div class="mbd">'+
      '<p style="font-size:13px;color:#8098BC;margin-bottom:12px">تعيين كلمة مرور جديدة لـ <strong style="color:#E8F0FF">'+esc(name)+'</strong></p>'+
      '<div class="field"><label>كلمة المرور الجديدة</label>'+
        '<div style="display:flex;gap:7px"><input type="text" id="rp_pw" placeholder="..."><button class="btn sm" onclick="genRP()">🔀</button></div>'+
      '</div>'+
    '</div>'+
    '<div class="mf"><button class="btn" onclick="closeModal()">إلغاء</button>'+
    '<button class="btn p" id="rpBtn" onclick="doResetPW(\''+id+'\',\''+esc(name)+'\')">تعيين</button></div>');
  genRP();
}
function genRP(){
  const ch='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#$!';
  let p='';for(let i=0;i<10;i++)p+=ch[Math.floor(Math.random()*ch.length)];
  const el=document.getElementById('rp_pw');if(el){el.value=p;navigator.clipboard?.writeText(p).catch(function(){});}
}
async function doResetPW(id,name){
  const np=mv('rp_pw');
  if(!np||np.length<4){toast('كلمة مرور قصيرة جداً','e');return;}
  const btn=document.getElementById('rpBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>';}
  try{
    await appResetPassword(id,np);
    closeModal();
    openModal(
      '<div class="mh"><h3 style="color:#10B981">✓ تم تغيير كلمة المرور</h3><button class="mx" onclick="closeModal()">×</button></div>'+
      '<div class="mbd"><div class="creds">'+
        '<div class="cl">المستخدم</div><div class="cv">'+esc(name)+'</div>'+
        '<div class="cl">كلمة المرور الجديدة</div>'+
        '<div class="cv"><span>'+esc(np)+'</span><button class="cpbtn" onclick="copyT(\''+esc(np)+'\')">نسخ</button></div>'+
      '</div></div>'+
      '<div class="mf"><button class="btn p" onclick="closeModal()">تم</button></div>');
  }catch(e){toast('خطأ: '+e.message,'e');if(btn){btn.disabled=false;btn.innerHTML='تعيين';}}
}

/* ═══ DIVS PAGE ═══ */
async function renderDivs(){

  try{
    const data=await appListUsers();
    const grid=document.getElementById('divGrid');
    if(!grid)return;
    grid.innerHTML=Object.entries(DIVS).map(function(e){
      const code=e[0],cfg=e[1];
      const mgr=data.find(function(p){return p.division===code&&p.role&&p.role.indexOf('manager')>-1;});
      const cnt=data.filter(function(p){return p.division===code;}).length;
      return '<div class="sc" style="border-color:'+cfg.color+'22">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'+
          '<div style="font-size:24px">'+cfg.icon+'</div>'+
          '<div><div style="font-weight:700;font-size:13px">'+cfg.ar+'</div>'+
          '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:'+cfg.color+'">'+code+'</div></div>'+
        '</div>'+
        '<div style="padding:6px 0;border-top:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between">'+
          '<span style="font-size:12px;color:#8098BC">المدير</span>'+
          '<span style="font-size:12px;font-weight:600">'+(mgr?esc(mgr.full_name):'غير محدد')+'</span>'+

        '<div style="padding:6px 0;border-top:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between">'+
          '<span style="font-size:12px;color:#8098BC">الأعضاء</span>'+
          '<span class="badge bg">'+cnt+' عضو</span>'+
        '</div>'+
        '<a href="'+(code==='national_grid'?'national-grid':code==='technical_alerts'?'technical-alerts':code)+'.html" class="btn sm" style="width:100%;margin-top:8px;justify-content:center;color:'+cfg.color+';border-color:'+cfg.color+'33">فتح البورتال ←</a>'+

/* ═══ HEALTH ═══ */
async function renderHealth(){
  const area=document.getElementById('pageArea');

      appListUsers(),

    ]);
    const hg=document.getElementById('hg');if(!hg)return;
    hg.innerHTML=[
      {sl:'مستخدمون',sv:Array.isArray(u)?u.length:'—'},

      {sl:'الاتصال',sv:'✓',g:true},
    ].map(function(s){return '<div class="sc"><div class="sl">'+s.sl+'</div><div class="sv'+(s.g?' grn':'')+'">'+s.sv+'</div></div>';}).join('');

function copyT(t){navigator.clipboard?.writeText(t).then(function(){toast('تم النسخ ✓','s');}).catch(function(){toast('انسخه يدوياً','i');});}

/* ═══ INIT ═══ */
(async function init(){
  try{
    const profile = await requireAuth(['admin']);
    if(!profile) return;
    // requireAuth() already renders the user badge into #ubEl.
    // Do not access #ubAv/#ubNm here because _renderBadge() replaces those original nodes.
    await renderUsers();
  }catch(e){
    console.error('Admin init failed:', e);
    const area=document.getElementById('pageArea');
    if(area){
      area.innerHTML='<div style="max-width:620px;margin:40px auto;padding:18px;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.07);border-radius:12px">'+
        '<div style="font-size:16px;font-weight:700;color:#FCA5A5;margin-bottom:7px">تعذر تحميل لوحة الأدمن</div>'+ 
        '<div style="font-size:12.5px;color:#8098BC;word-break:break-word;margin-bottom:12px">'+esc(e.message||String(e))+'</div>'+ 
        '<button class="btn sm" onclick="location.reload()">إعادة المحاولة</button></div>';
    }
  }
})();
