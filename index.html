<!DOCTYPE html>
<html lang="en" dir="ltr" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SE · OE Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    /* المتغيرات الأساسية والألوان */
    :root { --primary: #2563EB; --bg-dark: #020912; --panel-bg: #0C1E38; --text-main: #E8F0FF; --text-muted: #8098BC; --border: #152840; }
    * { box-sizing: border-box; font-family: 'IBM Plex Sans Arabic', sans-serif; }
    body { margin: 0; overflow: hidden; background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
    
    /* الخلفيات التفاعلية */
    #bgcv { position: fixed; inset: 0; z-index: 0; }
    #scv { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.5; }

    /* --- شاشة تسجيل الدخول الموحدة --- */
    #login-view { position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: linear-gradient(165deg, #091628, #020912); border: 1px solid var(--border); border-radius: 18px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 40px 100px rgba(0,0,0,.85); }
    .login-box h2 { font-family: 'Chakra Petch', sans-serif; margin: 0 0 5px; color: var(--primary); text-align: center; }
    .login-box p { color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 25px; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .input-group input { width: 100%; background: #060F1E; border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
    .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .btn-login { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-login:hover { filter: brightness(1.1); }
    .lang-toggle { position: absolute; top: 20px; right: 20px; background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-main); padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 12px; z-index: 100; }

    /* --- واجهة النظام (الداشبورد) المخفية مبدئياً --- */
    #app-view { display: none; position: relative; z-index: 10; height: 100vh; display: none; flex-direction: row; }
    
    /* القائمة الجانبية */
    .sidebar { width: 260px; background: rgba(9, 22, 40, 0.95); border-right: 1px solid var(--border); backdrop-filter: blur(10px); display: flex; flex-direction: column; padding: 20px 0; }
    .user-profile { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .user-profile h3 { margin: 0 0 5px; font-size: 16px; color: var(--primary); }
    .user-profile span { font-size: 12px; color: var(--text-muted); background: var(--panel-bg); padding: 3px 8px; border-radius: 4px; display: inline-block; }
    .nav-menu { flex: 1; list-style: none; padding: 0; margin: 0; }
    .nav-menu li { padding: 12px 20px; margin: 5px 15px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 14px; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
    .nav-menu li:hover, .nav-menu li.active { background: rgba(37,99,235,.1); color: var(--text-main); }
    .nav-menu li.active { border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0; }
    
    /* منطقة المحتوى */
    .main-content { flex: 1; padding: 30px; overflow-y: auto; background: radial-gradient(circle at top right, rgba(37,99,235,0.05), transparent 50%); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .top-bar h1 { margin: 0; font-family: 'Chakra Petch', sans-serif; font-size: 24px; }
    
    /* بطاقات الداشبورد */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: rgba(12, 30, 56, 0.7); border: 1px solid var(--border); border-radius: 12px; padding: 20px; backdrop-filter: blur(5px); }
    .card h4 { margin: 0 0 10px; color: var(--text-muted); font-size: 13px; }
    .card .value { font-size: 28px; font-weight: bold; font-family: 'IBM Plex Mono', monospace; }

    /* مساحة العمل (المهام، الروتين، التذاكر) */
    .workspace { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .panel { background: rgba(12, 30, 56, 0.7); border: 1px solid var(--border); border-radius: 12px; padding: 20px; min-height: 300px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
    
    /* زر تسجيل الخروج */
    .btn-logout { margin: auto 20px 0; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #EF4444; padding: 10px; border-radius: 8px; cursor: pointer; text-align: center; }

    /* Meeting Room Modal */
    #meeting-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
    .modal-content { background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--primary); text-align: center; width: 300px; }
</style>
</head>
<body>

<canvas id="bgcv"></canvas>
<canvas id="scv"></canvas>

<button class="lang-toggle" onclick="toggleLang()" id="langBtn">🌐 العربية</button>

<!-- 1. واجهة تسجيل الدخول الموحدة -->
<div id="login-view">
    <div class="login-box">
        <div style="text-align: center; margin-bottom: 20px;">
            <span style="font-size: 40px;">🏛️</span>
        </div>
        <h2 id="lbl-title">OE COMMAND CENTER</h2>
        <p id="lbl-subtitle">Unified Access Portal · بوابة الدخول الموحدة</p>
        
        <div class="input-group">
            <label id="lbl-user">Employee ID / Username</label>
            <input type="text" id="userid" placeholder="Enter ID..." autocomplete="off">
        </div>
        <div class="input-group">
            <label id="lbl-pass">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button class="btn-login" onclick="handleLogin()" id="lbl-btn">Sign In</button>
        <div id="login-error" style="color: #EF4444; font-size: 12px; margin-top: 10px; text-align: center; display: none;">Invalid credentials</div>
    </div>
</div>

<!-- 2. واجهة النظام (تظهر بعد تسجيل الدخول) -->
<div id="app-view">
    <!-- الشريط الجانبي الديناميكي -->
    <aside class="sidebar">
        <div class="user-profile">
            <h3 id="prof-name">User Name</h3>
            <span id="prof-role">Role</span>
            <div style="margin-top: 5px; font-size: 11px; color: var(--primary);" id="prof-dept">Department</div>
        </div>
        
        <ul class="nav-menu" id="nav-menu">
            <!-- سيتم حقن الروابط هنا بواسطة الجافاسكربت بناءً على الصلاحية -->
        </ul>
        
        <div class="btn-logout" onclick="logout()" id="lbl-logout">🚪 Sign Out</div>
    </aside>

    <!-- منطقة المحتوى الرئيسية -->
    <main class="main-content">
        <div class="top-bar">
            <h1 id="page-title">Dashboard Overview</h1>
            <button style="padding: 8px 15px; border-radius: 8px; border:none; background: var(--primary); color: white; cursor: pointer;" id="btn-create">+ Create Task</button>
        </div>
        
        <!-- سيتم تغيير المحتوى هنا بناءً على التبويب -->
        <div id="main-stage">
            <div class="cards-grid" id="dashboard-cards">
                <!-- الإحصائيات -->
            </div>
            
            <div class="workspace">
                <div class="panel">
                    <div class="panel-header">
                        <h3 style="margin:0" id="lbl-tasks">Tasks & Tracking</h3>
                        <span style="font-size: 12px; color: var(--primary); cursor: pointer;">View All</span>
                    </div>
                    <div id="tasks-list" style="font-size: 13px; color: var(--text-muted);">
                        Loading tasks...
                    </div>
                </div>
                
                <div class="panel">
                    <div class="panel-header">
                        <h3 style="margin:0" id="lbl-routine">Daily Routine</h3>
                    </div>
                    <div id="routine-list" style="font-size: 13px; color: var(--text-muted);">
                        Loading routine checklist...
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- نافذة الدخول لاجتماعات المدراء -->
<div id="meeting-modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color: var(--primary);">🔒 Meeting Room</h3>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">Enter the Admin PIN to access.</p>
        <input type="password" id="meeting-pin" style="width:100%; padding: 10px; background:#060F1E; border:1px solid var(--border); color:white; border-radius:6px; margin-bottom: 15px; text-align: center; letter-spacing: 5px;">
        <button style="width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer;" onclick="checkMeetingPin()">Enter Room</button>
        <button style="width: 100%; padding: 10px; background: transparent; color: var(--text-muted); border: none; cursor: pointer; margin-top: 5px;" onclick="document.getElementById('meeting-modal').style.display='none'">Cancel</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
