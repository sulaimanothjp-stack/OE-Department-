<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SE · OE Meeting Room</title><link rel="stylesheet" href="styles.css">
<style>
:root{--DC:#22C55E;--DR:34,197,94}body{background:#020912}.ni.on{color:#4ADE80;background:rgba(34,197,94,.12)}.ni.on::after{background:#22C55E}
.tb-ttl,.clk .ct{color:#4ADE80!important}.ld .d{background:#22C55E;color:#22C55E;box-shadow:0 0 7px #22C55E}
.meet-hero{position:relative;overflow:hidden;border:1px solid rgba(34,197,94,.17);border-radius:12px;background:linear-gradient(145deg,#22C55E08,#020912);margin-bottom:16px}
.meet-hero .in{position:relative;z-index:1;padding:18px 20px}.meet-hero h1{font-family:var(--hud);font-size:20px}.room-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}
.agenda-item{padding:11px 13px;border-bottom:1px solid rgba(34,197,94,.06);display:flex;gap:10px}.agenda-item:last-child{border-bottom:0}
.num{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:rgba(34,197,94,.12);color:#4ADE80;font-family:var(--hud);font-size:11px}
.decision{padding:10px 12px;border-right:3px solid #22C55E;background:#22C55E08;border-radius:8px;margin-bottom:8px}
.action{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid #152840}.action:last-child{border:0}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 8px #22C55E;animation:pd 1.8s infinite}
@media(max-width:900px){.room-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="shell">
<aside class="sb"><div class="sb-brand"><div id="lgEl"></div><div><div class="sb-t1" style="color:#4ADE80">se</div><div class="sb-t2">OE Meeting Center</div></div></div>
<div id="ubEl" class="ub"></div><nav class="nav" id="navEl"></nav><div class="sb-foot"><button class="btn-lo" onclick="doLogout()">🚪 خروج</button><button class="btn-lg" onclick="toggleLang()">EN/ع</button></div></aside>
<div class="main"><div class="topbar"><div class="tb-ttl fhud" id="pgtitle">مركز الاجتماعات</div><div class="tb-r"><div class="clk"><div class="ct" id="ct"></div><div id="cd" style="font-family:var(--mono);font-size:9.5px;color:var(--t3)"></div></div><div class="ld"><div class="d"></div><span style="color:#22C55E55;font-family:var(--mono);font-size:11px">MEETING ROOM</span></div></div></div><div class="page" id="pgContent"></div></div>
</div><div id="tc"></div><script src="app.js"></script><script>
const DC='#22C55E',DR='34,197,94';
const NAV=[
 {k:'center',ar:'مركز الاجتماعات',en:'Meeting Center',ic:'📅',fn:"go('center')"},
 {k:'room',ar:'غرفة الاجتماع',en:'Meeting Room',ic:'🎯',fn:"go('room')"},
 {g:'المخرجات',ge:'OUTPUTS'},
 {k:'actions',ar:'الإجراءات',en:'Actions',ic:'✓',fn:"go('actions')"},
 {k:'decisions',ar:'القرارات',en:'Decisions',ic:'◆',fn:"go('decisions')"},
 {k:'minutes',ar:'محضر الاجتماع',en:'Minutes',ic:'📋',fn:"go('minutes')"},
];
const PAGES={};const reg=(k,fn)=>PAGES[k]=fn;let currentMeetingId=new URLSearchParams(location.search).get('id')||null;
function go(k){const i=NAV.find(n=>n.k===k);document.getElementById('pgtitle').textContent=i?t2(i.ar,i.en):k;buildNav(NAV,k);const ct=document.getElementById('pgContent');ct.innerHTML='<div class="fade" id="pg"></div>';(PAGES[k]||PAGES.center)(document.getElementById('pg'));window.scrollTo(0,0)}

reg('center',async el=>{
 el.innerHTML=`<div class="meet-hero"><div class="in"><h1>📅 ${t2('مركز اجتماعات التميز التشغيلي','Operational Excellence Meeting Center')}</h1><div style="color:var(--t2);font-size:12.5px">${t2('من الأجندة إلى القرار ثم الإجراء والإغلاق','From agenda to decision, action and closure')}</div></div></div>
 <div class="g4 mb2" id="stats">${skR(4)}</div><div class="panel"><div class="ph"><h3 style="color:${DC}">${t2('الاجتماعات','Meetings')}</h3><button class="btn p sm" onclick="newMeeting()" style="background:${DC};border-color:${DC}">+ ${t2('اجتماع جديد','New Meeting')}</button></div><div id="ml">${skR(8)}</div></div>`;
 try{const {data}=await dbList('meetings',{lim:50});const sched=data.filter(x=>x.status==='scheduled').length,comp=data.filter(x=>x.status==='completed').length;
 document.getElementById('stats').innerHTML=[{l:'SCHEDULED',v:sched},{l:'COMPLETED',v:comp},{l:'TOTAL',v:data.length},{l:'LIVE',v:data.filter(x=>x.status==='in_progress').length}].map(x=>`<div class="sc"><div class="sl">${x.l}</div><div class="sv">${x.v}</div></div>`).join('');
 document.getElementById('ml').innerHTML=data.length?data.map(m=>`<div class="dr ptr" onclick="openRoom('${m.id}')"><div class="dd" style="background:${m.status==='completed'?'var(--success)':DC}"></div><div style="flex:1"><b>${esc(m.title)}</b><div style="font-size:11px;color:var(--t3)">${fmtD(m.date)} ${m.time||''} · ${m.type||'meeting'}</div></div>${stBadge(m.status)}</div>`).join(''):emptyEl(t2('لا توجد اجتماعات','No meetings'));}catch(e){toast(e.message,'e')}
});
function openRoom(id){currentMeetingId=id;history.replaceState({},'',`meeting.html?id=${id}`);go('room')}

reg('room',async el=>{
 if(!currentMeetingId){el.innerHTML=emptyEl(t2('اختر اجتماعاً من مركز الاجتماعات','Choose a meeting from Meeting Center'),`<button class="btn" onclick="go('center')">${t2('مركز الاجتماعات','Meeting Center')}</button>`);return}
 try{
  const m=await dbGet('meetings',currentMeetingId);if(!m){el.innerHTML=emptyEl(t2('الاجتماع غير موجود','Meeting not found'));return}
  const {data:acts}=await dbList('meeting_actions',{eq:{meeting_id:currentMeetingId}});
  const agenda=(m.agenda||'').split(/\n|;/).map(x=>x.trim()).filter(Boolean);
  el.innerHTML=`<div class="meet-hero"><div class="in"><div style="display:flex;align-items:center;gap:8px"><div class="live-dot"></div><span style="font-family:var(--mono);font-size:10px;color:#4ADE80">${m.status==='completed'?'CLOSED':'MEETING ROOM'}</span></div><h1>${esc(m.title)}</h1><div style="font-size:12px;color:var(--t2)">${fmtD(m.date)} · ${m.time||''} · ${m.type||'OE'}</div></div></div>
  <div class="room-grid"><div>
   <div class="panel mb2"><div class="ph"><h3 style="color:${DC}">☰ ${t2('الأجندة','Agenda')}</h3></div><div>${agenda.length?agenda.map((a,i)=>`<div class="agenda-item"><div class="num">${i+1}</div><div>${esc(a)}</div></div>`).join(''):`<div style="padding:14px;color:var(--t3)">${t2('لم تتم إضافة أجندة','No agenda added')}</div>`}</div></div>
   <div class="panel"><div class="ph"><h3 style="color:${DC}">✓ ${t2('إجراءات الاجتماع','Meeting Actions')}</h3><button class="btn sm" onclick="newAction()">${t2('+ إجراء','+ Action')}</button></div><div>${acts.length?acts.map(a=>`<div class="action"><div style="flex:1"><b>${esc(a.title)}</b><div style="font-size:11px;color:var(--t3)">${fmtD(a.due_date)}</div></div>${priBadge(a.priority)} ${stBadge(a.status)}</div>`).join(''):emptyEl(t2('لا توجد إجراءات','No actions'))}</div></div>
  </div><div>
   <div class="panel mb2"><div class="ph"><h3 style="color:${DC}">◆ ${t2('قرارات فورية','Live Decisions')}</h3></div><div style="padding:12px"><div id="decisionList"></div><div class="field"><textarea id="decisionText" rows="3" placeholder="${t2('اكتب قرار الاجتماع...','Write meeting decision...')}"></textarea></div><button class="btn p sm" onclick="addDecisionLocal()" style="background:${DC};border-color:${DC}">${t2('تثبيت القرار','Capture Decision')}</button></div></div>
   <div class="panel"><div class="ph"><h3 style="color:${DC}">⚙ ${t2('التحكم','Controls')}</h3></div><div style="padding:12px;display:grid;gap:8px"><button class="btn p" onclick="setStatus('in_progress')" style="background:${DC};border-color:${DC}">${t2('بدء الاجتماع','Start Meeting')}</button><button class="btn" onclick="go('minutes')">${t2('فتح المحضر','Open Minutes')}</button><button class="btn" onclick="setStatus('completed')" style="color:var(--success)">${t2('إنهاء الاجتماع','Complete Meeting')}</button></div></div>
  </div></div>`;
  renderDecisions();
 }catch(e){toast(e.message,'e')}
});
let localDecisions=[];
function addDecisionLocal(){const v=mv('decisionText');if(!v)return;localDecisions.push({text:v,ts:new Date()});ms('decisionText','');renderDecisions()}
function renderDecisions(){const el=document.getElementById('decisionList');if(!el)return;el.innerHTML=localDecisions.length?localDecisions.map((d,i)=>`<div class="decision"><b>${t2('قرار','Decision')} ${i+1}</b><div>${esc(d.text)}</div></div>`):`<div style="font-size:12px;color:var(--t3);margin-bottom:8px">${t2('لا توجد قرارات مسجلة بعد','No decisions captured yet')}</div>`}

function newMeeting(){openModal(`<div class="mh"><h3>📅 ${t2('اجتماع جديد','New Meeting')}</h3><button class="mx" onclick="closeModal()">×</button></div><div class="mbd">
<div class="field"><label>${t2('العنوان','Title')}</label><input id="nm_t"></div><div class="fg"><div class="field"><label>${t2('التاريخ','Date')}</label><input type="date" id="nm_d"></div><div class="field"><label>${t2('الوقت','Time')}</label><input type="time" id="nm_tm"></div></div>
<div class="field"><label>${t2('النوع','Type')}</label><select id="nm_ty"><option value="weekly">Weekly OE</option><option value="qbr">QBR</option><option value="review">Review</option><option value="escalation">Escalation</option></select></div>
<div class="field"><label>${t2('الأجندة - كل بند في سطر','Agenda - one item per line')}</label><textarea id="nm_a" rows="5"></textarea></div></div>
<div class="mf"><button class="btn" onclick="closeModal()">${t2('إلغاء','Cancel')}</button><button class="btn p" onclick="saveNewMeeting()" style="background:${DC};border-color:${DC}">${t2('حفظ','Save')}</button></div>`)}
async function saveNewMeeting(){const t=mv('nm_t');if(!t){toast(t2('أدخل العنوان','Enter title'),'e');return}try{const m=await dbIns('meetings',{title:t,date:mv('nm_d')||null,time:mv('nm_tm')||null,type:mv('nm_ty')||'weekly',agenda:mv('nm_a'),organizer_id:App.profile.id,division:App.profile.division||null,status:'scheduled'});toast(t2('تم إنشاء الاجتماع','Meeting created'),'s');closeModal();openRoom(m.id)}catch(e){toast(e.message,'e')}}
function newAction(){if(!currentMeetingId)return;openModal(`<div class="mh"><h3>+ ${t2('إجراء جديد','New Action')}</h3><button class="mx" onclick="closeModal()">×</button></div><div class="mbd"><div class="field"><label>${t2('الإجراء','Action')}</label><input id="na_t"></div><div class="fg"><div class="field"><label>${t2('الاستحقاق','Due Date')}</label><input type="date" id="na_d"></div><div class="field"><label>${t2('الأولوية','Priority')}</label><select id="na_p"><option value="medium">Medium</option><option value="high">High</option><option value="critical">Critical</option><option value="low">Low</option></select></div></div></div><div class="mf"><button class="btn" onclick="closeModal()">${t2('إلغاء','Cancel')}</button><button class="btn p" onclick="saveAction()" style="background:${DC}">${t2('حفظ','Save')}</button></div>`)}
async function saveAction(){const t=mv('na_t');if(!t)return;try{await dbIns('meeting_actions',{meeting_id:currentMeetingId,title:t,due_date:mv('na_d')||null,priority:mv('na_p')||'medium',assigned_by:App.profile.id,assigned_to:App.profile.id,status:'open'});toast(t2('تم إضافة الإجراء','Action added'),'s');closeModal();go('room')}catch(e){toast(e.message,'e')}}
async function setStatus(status){try{await dbUpd('meetings',currentMeetingId,{status,updated_at:new Date().toISOString()});toast(t2('تم تحديث حالة الاجتماع','Meeting status updated'),'s');go('room')}catch(e){toast(e.message,'e')}}

reg('actions',async el=>{if(!currentMeetingId){el.innerHTML=emptyEl(t2('اختر اجتماعاً أولاً','Choose a meeting first'));return}const {data}=await dbList('meeting_actions',{eq:{meeting_id:currentMeetingId}});el.innerHTML=`<div class="panel"><div class="ph"><h3 style="color:${DC}">✓ ${t2('الإجراءات','Actions')}</h3><button class="btn sm" onclick="newAction()">+ ${t2('إجراء','Action')}</button></div>${data.length?data.map(a=>`<div class="action"><div style="flex:1"><b>${esc(a.title)}</b><div style="font-size:11px;color:var(--t3)">${fmtD(a.due_date)}</div></div>${priBadge(a.priority)} ${stBadge(a.status)}</div>`).join(''):emptyEl(t2('لا توجد إجراءات','No actions'))}</div>`});
reg('decisions',el=>{el.innerHTML=`<div class="panel"><div class="ph"><h3 style="color:${DC}">◆ ${t2('القرارات','Decisions')}</h3></div><div style="padding:14px" id="decisionList"></div></div>`;renderDecisions()});
reg('minutes',async el=>{let m=currentMeetingId?await dbGet('meetings',currentMeetingId):null;el.innerHTML=`<div class="panel"><div class="ph"><h3 style="color:${DC}">📋 ${t2('محضر الاجتماع','Meeting Minutes')}</h3></div><div style="padding:16px"><div class="field"><label>${t2('الاجتماع','Meeting')}</label><input value="${esc(m?.title||'')}" readonly></div><div class="field"><label>${t2('المناقشات الرئيسية','Key Discussion')}</label><textarea id="min_disc" rows="5"></textarea></div><div class="field"><label>${t2('القرارات','Decisions')}</label><textarea id="min_dec" rows="5">${localDecisions.map(d=>'- '+d.text).join('\n')}</textarea></div><div class="field"><label>${t2('ملاحظات ختامية','Closing Notes')}</label><textarea id="min_note" rows="4"></textarea></div><button class="btn p" onclick="toast(t2('تم تجهيز المحضر','Minutes prepared'),'s')" style="background:${DC};border-color:${DC}">${t2('اعتماد المسودة','Prepare Draft')}</button></div></div>`});

requireAuth(['admin','director','governance_manager','generation_manager','national_grid_manager','distribution_manager','technical_alerts_manager','employee']).then(p=>{if(!p)return;buildNav(NAV,currentMeetingId?'room':'center');go(currentMeetingId?'room':'center')});
</script></body></html>
