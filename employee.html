<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SE · بوابة الموظف</title>
<link rel="stylesheet" href="styles.css">
<style>
:root{--DC:#6366F1;--DR:99,102,241}
body{background:#020912}.ni.on{color:#818CF8;background:rgba(99,102,241,.13)}.ni.on::after{background:#6366F1}
.tb-ttl,.clk .ct{color:#818CF8!important}.ld .d{background:#6366F1;color:#6366F1;box-shadow:0 0 6px #6366F1}
.hero{background:linear-gradient(135deg,#6366F10A,#020912)}.menu-btn{display:none}
.focus{border:1px solid rgba(99,102,241,.18);background:linear-gradient(145deg,#6366F108,#091628);border-radius:12px;padding:14px}
.timeline{display:grid;gap:8px}.tl{display:flex;gap:10px;padding:10px 12px;border:1px solid #152840;border-radius:9px;background:#091628}
.tl-dot{width:9px;height:9px;border-radius:50%;background:#6366F1;box-shadow:0 0 8px #6366F1;margin-top:6px;flex:0 0 auto}
@media(max-width:760px){.menu-btn{display:block}}
</style>
</head>
<body>
<div class="shell">
<aside class="sb">
  <div class="sb-brand"><div id="lgEl"></div><div><div class="sb-t1" style="color:#818CF8">se</div><div class="sb-t2">بوابة الموظف</div></div></div>
  <div id="ubEl" class="ub"></div><nav class="nav" id="navEl"></nav>
  <div class="sb-foot"><button class="btn-lo" onclick="doLogout()">🚪 خروج</button><button class="btn-lg" onclick="toggleLang()">EN/ع</button></div>
</aside>
<div class="main">
  <div class="topbar"><button class="menu-btn" onclick="document.querySelector('.sb').classList.toggle('show')">☰</button>
    <div class="tb-ttl fhud" id="pgtitle" style="flex:1">مساحتي</div>
    <div class="tb-r"><div class="clk"><div class="ct" id="ct"></div><div id="cd" style="font-family:var(--mono);font-size:9.5px;color:var(--t3)"></div></div>
    <button class="nbtn" onclick="go('alerts')">🔔</button><div class="ld"><div class="d"></div><span style="color:#6366F144;font-family:var(--mono);font-size:11px">MY OE</span></div></div>
  </div>
  <div class="page" id="pgContent"></div>
</div></div><div id="tc"></div>
<script src="app.js"></script>
<script>
const DC='#6366F1',DR='99,102,241';
const NAV=[
 {k:'home',ar:'مساحتي',en:'My Workspace',ic:'◈',fn:"go('home')"},
 {k:'day',ar:'يومي',en:'My Day',ic:'☀️',fn:"go('day')"},
 {g:'عملي',ge:'MY WORK'},
 {k:'tasks',ar:'مهامي',en:'My Tasks',ic:'✓',fn:"go('tasks')"},
 {k:'afis',ar:'نقاط التحسين',en:'My AFIs',ic:'▲',fn:"go('afis')"},
 {k:'meetings',ar:'اجتماعاتي',en:'My Meetings',ic:'📅',fn:"go('meetings')"},
 {g:'متابعة',ge:'TRACKING'},
 {k:'weekly',ar:'تحديثي الأسبوعي',en:'Weekly Update',ic:'📊',fn:"go('weekly')"},
 {k:'alerts',ar:'التنبيهات',en:'Alerts',ic:'⚠️',fn:"go('alerts')"},
];
let _cur='home';
function go(k){_cur=k;const i=NAV.find(n=>n.k===k);document.getElementById('pgtitle').textContent=i?t2(i.ar,i.en):k;buildNav(NAV,k);
 const ct=document.getElementById('pgContent');ct.innerHTML='<div class="fade" id="pg"></div>';(PAGES[k]||PAGES.home)(document.getElementById('pg'));window.scrollTo(0,0);}
const PAGES={};const reg=(k,fn)=>PAGES[k]=fn;
function myDiv(){return App.profile?.division||null}

reg('home',async el=>{
 el.innerHTML=`<div class="hero mb2"><canvas class="hcv" id="hcv"></canvas><div class="hi"><h1>👤 ${t2('مرحباً','Welcome')}, ${esc(App.profile?.full_name||'')}</h1>
 <div class="hs">${t2('مساحة العمل الشخصية · المطلوب منك اليوم · المتابعة · الإنجاز','Personal workspace · today’s priorities · follow-up · delivery')}</div>
 <div class="hks" id="hks">${skR(4)}</div></div><div class="hb"></div></div>
 <div class="g21 mb2"><div class="panel"><div class="ph"><h3 style="color:${DC}">🎯 ${t2('الأولوية الآن','Priority Now')}</h3></div><div id="focus">${skR(4)}</div></div>
 <div class="panel"><div class="ph"><h3 style="color:${DC}">📅 ${t2('القادم','Coming Up')}</h3></div><div id="coming">${skR(3)}</div></div></div>
 <div class="g2"><div class="panel"><div class="ph"><h3 style="color:${DC}">✓ ${t2('مهامي','My Tasks')}</h3><button class="btn sm" onclick="go('tasks')">${t2('عرض الكل','View all')}</button></div><div id="tasksP">${skR(4)}</div></div>
 <div class="panel"><div class="ph"><h3 style="color:${DC}">▲ ${t2('نقاط التحسين','AFIs')}</h3><button class="btn sm" onclick="go('afis')">${t2('عرض الكل','View all')}</button></div><div id="afiP">${skR(3)}</div></div></div>`;
 initCanvas('hcv','net',DC);
 try{
   const uid=App.profile.id, div=myDiv();
   const [tasks,afis,meetings]=await Promise.all([
     dbList('tasks',{eq:{assigned_to:uid},lim:8}),
     div?dbList('afis',{eq:{business_line:div},neq:{status:'closed'},lim:6}):Promise.resolve({data:[]}),
     dbList('meetings',{neq:{status:'cancelled'},lim:5})
   ]);
   const openT=tasks.data.filter(x=>!['closed','done'].includes(x.status)).length;
   const overdue=tasks.data.filter(x=>isOD(x.due_date,x.status)).length;
   document.getElementById('hks').innerHTML=[
    {v:openT,l:'OPEN TASKS',cl:''},{v:overdue,l:'OVERDUE',cl:overdue?'rd':'gn'},{v:afis.data.length,l:'AFIs',cl:''},{v:meetings.data.length,l:'MEETINGS',cl:''}
   ].map(x=>`<div class="hk ${x.cl}"><div class="hv">${x.v}</div><div class="hl">${x.l}</div></div>`).join('');
   const focus=[...tasks.data].filter(x=>!['closed','done'].includes(x.status)).sort((a,b)=>(a.priority==='critical'?-1:0)-(b.priority==='critical'?-1:0)).slice(0,4);
   document.getElementById('focus').innerHTML=focus.length?focus.map(x=>`<div class="dr"><div class="dd" style="background:${x.priority==='critical'?'var(--danger)':DC}"></div><div style="flex:1"><b>${esc(x.title)}</b><div style="font-size:11px;color:var(--t3)">${fmtD(x.due_date)}</div></div>${priBadge(x.priority)} ${stBadge(x.status)}</div>`).join(''):emptyEl(t2('لا توجد أولويات مفتوحة','No open priorities'));
   document.getElementById('tasksP').innerHTML=tasks.data.length?tasks.data.slice(0,5).map(x=>`<div class="dr"><div style="flex:1"><b>${esc(x.title)}</b><div style="font-size:11px;color:var(--t3)">${fmtD(x.due_date)}</div></div>${stBadge(x.status)}</div>`).join(''):emptyEl(t2('لا توجد مهام','No tasks'));
   document.getElementById('afiP').innerHTML=afis.data.length?afis.data.slice(0,4).map(x=>`<div class="dr"><div style="flex:1"><b>${esc(x.title)}</b><div style="font-size:11px;color:var(--t3)">${x.afi_number||''}</div></div>${priBadge(x.priority)} ${stBadge(x.status)}</div>`).join(''):emptyEl(t2('لا توجد نقاط تحسين','No AFIs'));
   document.getElementById('coming').innerHTML=meetings.data.length?meetings.data.slice(0,4).map(m=>`<div class="dr ptr" onclick="location.href='meeting.html?id=${m.id}'"><div style="flex:1"><b>${esc(m.title)}</b><div style="font-size:11px;color:var(--t3)">${fmtD(m.date)} ${m.time||''}</div></div>${stBadge(m.status)}</div>`).join(''):emptyEl(t2('لا اجتماعات قادمة','No upcoming meetings'));
 }catch(e){toast(e.message,'e')}
});

reg('day',async el=>{
 el.innerHTML=`<div class="ph" style="padding:0 0 12px;border:0"><h3 style="color:${DC}">☀️ ${t2('يومي التشغيلي','My Operational Day')}</h3></div><div class="timeline" id="dayList">${skR(6)}</div>`;
 try{const {data}=await dbList('tasks',{eq:{assigned_to:App.profile.id},lim:20});
 const active=data.filter(x=>!['closed','done'].includes(x.status));
 document.getElementById('dayList').innerHTML=active.length?active.map((x,i)=>`<div class="tl"><div class="tl-dot"></div><div style="flex:1"><b>${esc(x.title)}</b><div style="font-size:11.5px;color:var(--t2)">${t2('الاستحقاق','Due')}: ${fmtD(x.due_date)}</div></div>${priBadge(x.priority)} ${stBadge(x.status)}</div>`).join(''):emptyEl(t2('يومك خالٍ من المهام المفتوحة','No open tasks today'));}catch(e){toast(e.message,'e')}
});

reg('tasks',async el=>{
 el.innerHTML=`<div class="panel"><div class="ph"><h3 style="color:${DC}">✓ ${t2('مهامي','My Tasks')}</h3></div><div id="list">${skR(8)}</div></div>`;
 try{const {data}=await dbList('tasks',{eq:{assigned_to:App.profile.id},lim:50});document.getElementById('list').innerHTML=data.length?data.map(x=>`<div class="dr"><div style="flex:1"><b>${esc(x.title)}</b><div style="font-size:11px;color:var(--t3)">${fmtD(x.due_date)}</div></div>${priBadge(x.priority)} ${stBadge(x.status)}</div>`).join(''):emptyEl(t2('لا توجد مهام','No tasks'));}catch(e){toast(e.message,'e')}
});
reg('afis',async el=>{el.innerHTML=`<div class="panel"><div class="ph"><h3 style="color:${DC}">▲ ${t2('نقاط التحسين','AFIs')}</h3></div><div id="list">${skR(6)}</div></div>`;try{const d=myDiv();const {data}=d?await dbList('afis',{eq:{business_line:d},neq:{status:'closed'},lim:50}):{data:[]};document.getElementById('list').innerHTML=data.length?data.map(x=>`<div class="dr"><div style="flex:1"><b>${esc(x.title)}</b><div style="font-size:11px;color:var(--t3)">${x.afi_number||''} · ${fmtD(x.due_date)}</div></div>${priBadge(x.priority)} ${stBadge(x.status)}</div>`).join(''):emptyEl(t2('لا توجد نقاط تحسين','No AFIs'));}catch(e){toast(e.message,'e')}});

reg('meetings',async el=>{el.innerHTML=`<div class="panel"><div class="ph"><h3 style="color:${DC}">📅 ${t2('اجتماعاتي','My Meetings')}</h3><button class="btn sm p" onclick="location.href='meeting.html'" style="background:${DC}">${t2('مركز الاجتماعات','Meeting Center')}</button></div><div id="list">${skR(6)}</div></div>`;try{const {data}=await dbList('meetings',{neq:{status:'cancelled'},lim:30});document.getElementById('list').innerHTML=data.length?data.map(m=>`<div class="dr ptr" onclick="location.href='meeting.html?id=${m.id}'"><div style="flex:1"><b>${esc(m.title)}</b><div style="font-size:11px;color:var(--t3)">${fmtD(m.date)} ${m.time||''}</div></div>${stBadge(m.status)}</div>`).join(''):emptyEl(t2('لا توجد اجتماعات','No meetings'));}catch(e){toast(e.message,'e')}});

reg('weekly',el=>{el.innerHTML=`<div class="panel"><div class="ph"><h3 style="color:${DC}">📊 ${t2('التحديث الأسبوعي','Weekly Update')}</h3></div><div style="padding:16px"><div class="field"><label>${t2('أبرز ما تم إنجازه','Key accomplishments')}</label><textarea id="wu1" rows="4"></textarea></div><div class="field"><label>${t2('التحديات / العوائق','Challenges / blockers')}</label><textarea id="wu2" rows="4"></textarea></div><div class="field"><label>${t2('أولويات الأسبوع القادم','Next week priorities')}</label><textarea id="wu3" rows="4"></textarea></div><button class="btn p" onclick="toast(t2('تم حفظ المسودة محلياً','Draft saved locally'),'s')" style="background:${DC}">${t2('حفظ المسودة','Save draft')}</button></div></div>`});
reg('alerts',el=>{const d=myDiv(); if(typeof renderAlerts==='function'&&d)renderAlerts(el,d,DC,DR);else el.innerHTML=emptyEl(t2('لا توجد تنبيهات متاحة','No alerts available'));});

requireAuth(['employee','admin','director','governance_manager','generation_manager','national_grid_manager','distribution_manager','technical_alerts_manager']).then(p=>{if(!p)return;buildNav(NAV,'home');go('home')});
</script></body></html>
